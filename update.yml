name: Mise à jour de la veille et de l'encyclopédie
on:
  schedule: [{cron: "0 5 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/fetch_news.py
      - run: python scripts/enrich_encyclopedia.py
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "veille-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "maj veille et encyclopédie" && git push)
